# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

# For every job:
# continueOnError: false means it's a required test job and will block merge if it fails
# continueOnError: true means it's an optional test job and will not block merge even though it fails(unless a required test job depends on its result)

# For PR test job:
# If the current branch is not master, please reference the remote template by appending @sonic-mgmt.
# For example, "- template: .azure-pipelines/run-test-elastictest-template.yml@sonic-mgmt"

pr:
   branches:
     include:
       - master
       - 202???
   paths:
     exclude:
       - .github
       - docs
       - LICENSE
       - README.md
       - SECURITY.md
       - sdn_tests/**
       - '**/*.md'
trigger:
  branches:
    include:
      - gh-readonly-queue/*

name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

resources:
  repositories:
    - repository: sonic-mgmt
      type: github
      name: sonic-net/sonic-mgmt
      ref: master
      endpoint: sonic-net
    - repository: buildimage
      type: github
      name: sonic-net/sonic-buildimage
      ref: refs/pull/28789/head
      endpoint: sonic-net


stages:
- template: /.azure-pipelines/common2/stages/analyze-code.yml
- template: /.azure-pipelines/probe-tests/stages/probe-tests.yml
- stage: Pre_test
  condition: succeededOrFailed()
  jobs:
  - job: detect_skip_expiry_changes
    displayName: "Detect skip_expiry changes"
    timeoutInMinutes: 10
    continueOnError: false
    pool: sonic-ubuntu-1c
    steps:
    - checkout: self
      clean: true

    - script: |
        set -euo pipefail

        TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-refs/heads/master}"
        TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"

        git fetch origin "${TARGET_BRANCH}" --depth=1
        BASE_COMMIT=$(git merge-base "origin/${TARGET_BRANCH}" HEAD || true)

        if [[ -z "${BASE_COMMIT}" ]]; then
          echo "Unable to determine merge base with origin/${TARGET_BRANCH}; falling back to HEAD~1"
          BASE_COMMIT="HEAD~1"
        fi

        CHANGED_FILES=$(git diff --name-only "${BASE_COMMIT}" HEAD -- tools/skip_expiry | tr '\n' ' ')
        if [[ -n "${CHANGED_FILES}" ]]; then
          echo "Detected changes under tools/skip_expiry: ${CHANGED_FILES}"
          echo "##vso[task.setvariable variable=SKIP_EXPIRY_CHANGED;isOutput=true]true"
        else
          echo "No changes detected under tools/skip_expiry"
          echo "##vso[task.setvariable variable=SKIP_EXPIRY_CHANGED;isOutput=true]false"
        fi
      name: DetectChanges
      displayName: "Check changed files under tools/skip_expiry"

  - job: detect_gobgp_shim_changes
    displayName: "Detect GoBGP shim changes"
    timeoutInMinutes: 10
    continueOnError: false
    pool: sonic-ubuntu-1c
    steps:
    - checkout: self
      clean: true

    - script: |
        set -euo pipefail

        TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-refs/heads/master}"
        TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"
        SHIM_PATHS=("ansible/roles/vm_set/files/gobgp" "ansible/library/gobgp.py" "ansible/roles/vm_set/tasks/announce_routes.yml")

        # Default to running the tests. A gate that cannot work out its own
        # base must not drop coverage, and must not fail the pipeline either.
        CHANGED="true"

        if git fetch origin "${TARGET_BRANCH}" --depth=1 &&
           BASE_COMMIT=$(git merge-base "origin/${TARGET_BRANCH}" HEAD 2>/dev/null) &&
           CHANGED_FILES=$(git diff --name-only "${BASE_COMMIT}" HEAD -- "${SHIM_PATHS[@]}" | tr '\n' ' '); then
          if [[ -n "${CHANGED_FILES}" ]]; then
            echo "Detected changes under ${SHIM_PATHS[*]}: ${CHANGED_FILES}"
          else
            CHANGED="false"
            echo "No changes detected under ${SHIM_PATHS[*]}"
          fi
        else
          echo "Cannot diff against origin/${TARGET_BRANCH}; running the tests"
        fi

        echo "##vso[task.setvariable variable=GOBGP_SHIM_CHANGED;isOutput=true]${CHANGED}"
      name: DetectChanges
      displayName: "Check changed files under the GoBGP shim and speaker manager"

  - job: static_analysis
    displayName: "Static Analysis"
    timeoutInMinutes: 10
    continueOnError: false
    pool:
      vmImage: ubuntu-latest
    steps:
    - template: .azure-pipelines/pre-commit-check.yml

  - job: validate_test_cases
    displayName: "Validate Test Cases"
    timeoutInMinutes: 30
    continueOnError: false
    pool:
      vmImage: ubuntu-latest
    steps:
    - template: .azure-pipelines/pytest-collect-only.yml
      parameters:
        MGMT_BRANCH: ""

  - job: dependency_check
    displayName: "Dependency Check"
    timeoutInMinutes: 10
    pool:
      vmImage: ubuntu-latest
    steps:
      - template: .azure-pipelines/dependency-check.yml

  - job: markers_check
    displayName: "Markers Check"
    timeoutInMinutes: 10
    pool:
      vmImage: ubuntu-latest
    steps:
      - template: .azure-pipelines/markers-check.yml

  - job: meta_check
    displayName: "Meta check"
    timeoutInMinutes: 10
    pool:
      vmImage: ubuntu-latest
    steps:
      - template: .azure-pipelines/meta-check.yml


- stage: Skip_Expiry_Unit_Tests
  displayName: "Skip Expiry Unit Tests"
  dependsOn: Pre_test
  condition: >-
    and(
      succeeded(),
      not(canceled()),
      eq(dependencies.Pre_test.outputs['detect_skip_expiry_changes.DetectChanges.SKIP_EXPIRY_CHANGED'], 'true')
    )
  jobs:
  - job: run_skip_expiry_unit_tests
    displayName: "Run tools/skip_expiry unit tests"
    timeoutInMinutes: 15
    continueOnError: false
    pool: sonic-ubuntu-1c
    steps:
    - checkout: self
      clean: true

    - script: |
        set -euo pipefail
        sudo uv pip install --system pytest requests PyYAML
      displayName: "Install unit test dependencies"

    - script: |
        set -euo pipefail
        python -m pytest tools/skip_expiry/tests/unit_test_*.py -q
      displayName: "Run skip_expiry unit tests"


- stage: GoBGP_Shim_Unit_Tests
  displayName: "GoBGP Shim Unit Tests"
  dependsOn: Pre_test
  condition: >-
    and(
      succeeded(),
      not(canceled()),
      eq(dependencies.Pre_test.outputs['detect_gobgp_shim_changes.DetectChanges.GOBGP_SHIM_CHANGED'], 'true')
    )
  jobs:
  - job: run_gobgp_shim_unit_tests
    displayName: "Run GoBGP shim and speaker manager unit tests"
    timeoutInMinutes: 15
    continueOnError: false
    pool: sonic-ubuntu-1c
    steps:
    - checkout: self
      clean: true

    - script: |
        set -euo pipefail
        # jinja2 backs the speaker manager's config rendering; pyyaml backs the
        # DOCUMENTATION schema test.
        sudo uv pip install --system pytest jinja2 pyyaml
      displayName: "Install unit test dependencies"

    - script: |
        set -euo pipefail
        python -m pytest ansible/roles/vm_set/files/gobgp/tests -q -rs
      displayName: "Run GoBGP shim and speaker manager unit tests"


# Temporary companion image for IS-IS PR #28767. Remove this stage and the
# buildimage resource once the backend and CLI are present in the default image.
- stage: Build_ISIS_VS
  displayName: "Build paired IS-IS multi-ASIC VS image"
  dependsOn: Pre_test
  condition: and(not(canceled()), eq(dependencies.Pre_test.result, 'Succeeded'), eq(variables['System.PullRequest.PullRequestNumber'], '28767'))
  pool: sonicso1ES-amd64
  variables:
  - template: .azure-pipelines/template-variables.yml@buildimage
  - template: .azure-pipelines/azure-pipelines-repd-build-variables.yml@buildimage
  - name: CACHE_MODE
    value: rcache
  - name: SKIP_CHECKOUT
    value: y
  jobs:
  - template: .azure-pipelines/azure-pipelines-image-template.yml@buildimage
    parameters:
      SUBMODULE: sonic-utilities
      COMMIT_ID: 47ad0714cca3810a9487c47c9d9afb8fc8bc8907
      jobGroups:
      - name: vs
      jobVariables:
        PLATFORM_AZP: $(GROUP_NAME)
        PLATFORM_ARCH: amd64
        BUILD_NUMBER: $(Build.BuildId)
        BUILD_OPTIONS: USERNAME=admin SONIC_BUILD_JOBS=$(nproc) BUILD_MULTIASIC_KVM=y INCLUDE_DHCP_SERVER=y $(VERSION_CONTROL_OPTIONS)
        DOCKER_DATA_ROOT_FOR_MULTIARCH: /data/march/docker
      preSteps:
      - checkout: buildimage
        path: s
        submodules: recursive
        fetchDepth: 0
      - bash: |
          set -e
          git checkout c75be6be12ce56887af64e2f20d436651fed7859
          git submodule update --init --recursive
          git -C src/sonic-utilities fetch origin refs/pull/4738/head
        displayName: "Fetch matching backend and CLI commits"
      buildSteps:
      - bash: |
          set -e
          make $(BUILD_OPTIONS) target/docker-sonic-vs.gz target/sonic-vs.img.gz
        displayName: "Build multi-ASIC SONiC image"
      - template: /.azure-pipelines/check-dirty-version.yml@buildimage
      postSteps:
      - bash: |
          echo "##vso[task.setvariable variable=BUILD_ID;isOutput=true]$(Build.BuildId)"
          echo "##vso[task.setvariable variable=PIPELINE_ID;isOutput=true]$(System.DefinitionId)"
        name: PairedImage
        displayName: "Export paired image artifact coordinates"

- stage: Test
  dependsOn:
  - Pre_test
  - Build_ISIS_VS
  condition: and(not(canceled()), eq(dependencies.Pre_test.result, 'Succeeded'), in(dependencies.Build_ISIS_VS.result, 'Succeeded', 'Skipped'), not(startsWith(variables['Build.SourceBranch'], 'refs/heads/gh-readonly-queue/')))
  variables:
  - group: SONiC-Elastictest
  - name: BUILD_BRANCH
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      value: $(System.PullRequest.TargetBranch)
    ${{ else }}:
      value: $(Build.SourceBranchName)
  - name: ISIS_KVM_BUILD_ID
    value: $[ coalesce(stageDependencies.Build_ISIS_VS.vs.outputs['PairedImage.BUILD_ID'], '') ]
  - name: ISIS_KVM_PIPELINE_ID
    value: $[ coalesce(stageDependencies.Build_ISIS_VS.vs.outputs['PairedImage.PIPELINE_ID'], '') ]

  jobs:
    - template: .azure-pipelines/pr_test_template.yml
      parameters:
        VS_KVM_BUILD_ID: $(ISIS_KVM_BUILD_ID)
        KVM_IMAGE_BUILD_PIPELINE_ID: $(ISIS_KVM_PIPELINE_ID)
