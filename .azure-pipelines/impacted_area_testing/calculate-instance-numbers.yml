parameters:
  - name: TOPOLOGY
    type: string
    default: ""

  - name: BUILD_BRANCH
    type: string
    default: ""

  - name: PREPARE_TIME
    default: 30

steps:
- script: |
    python3 - "${{ parameters.TOPOLOGY }}" <<'PY'
    import base64
    import gzip
    import json
    import os
    import sys
    from typing import Dict, List

    scripts_by_checker: Dict[str, List[str]] = json.loads(
        gzip.decompress(base64.b64decode(os.environ["TEST_SCRIPTS"], validate=True))
    )
    scripts = scripts_by_checker[f"{sys.argv[1]}_checker"]
    if not isinstance(scripts, list):
        raise TypeError("Expected a list of test scripts")

    print("TEST_SCRIPTS script count per checker:")
    for name, checker_scripts in scripts_by_checker.items():
        print(f"  {name}: {len(checker_scripts)}")
    print(f"##vso[task.setvariable variable=SCRIPTS]{','.join(scripts)}", end="")
    PY
  displayName: "Get ${{ parameters.TOPOLOGY }} test scripts"

- script: |
    set -x

    # Check if azure cli is installed. If not, try to install it
    if ! command -v az; then
      echo "Azure CLI is not installed. Trying to install it..."

      echo "Get packages needed for the installation process"
      sudo apt-get -o DPkg::Lock::Timeout=600 update
      sudo apt-get -o DPkg::Lock::Timeout=600 -y install apt-transport-https ca-certificates curl gnupg lsb-release

      echo "Download and install the Microsoft signing key"
      sudo mkdir -p /etc/apt/keyrings
      curl -sLS https://packages.microsoft.com/keys/microsoft.asc |
        gpg --dearmor | sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null
      sudo chmod go+r /etc/apt/keyrings/microsoft.gpg

      echo "Add the Azure CLI software repository"
      AZ_DIST=$(lsb_release -cs)
      echo "Types: deb
    URIs: https://packages.microsoft.com/repos/azure-cli/
    Suites: ${AZ_DIST}
    Components: main
    Architectures: $(dpkg --print-architecture)
    Signed-by: /etc/apt/keyrings/microsoft.gpg" | sudo tee /etc/apt/sources.list.d/azure-cli.sources

      echo "Update repository information and install the azure-cli package"
      sudo apt-get -o DPkg::Lock::Timeout=600 update
      sudo apt-get -o DPkg::Lock::Timeout=600 -y install azure-cli
    else
      echo "Azure CLI is already installed"
    fi
  displayName: "Install azure-cli"

- script: |
    set -x

    sudo uv pip install --system azure-kusto-data azure-identity

    INSTANCE_NUMBER=$(python3 ./.azure-pipelines/impacted_area_testing/calculate_instance_number.py --scripts $(SCRIPTS) --topology ${{ parameters.TOPOLOGY }} --branch ${{ parameters.BUILD_BRANCH }} --prepare_time ${{ parameters.PREPARE_TIME }} --target_pr_test_time $(TARGET_PR_TEST_TIME))

    if [[ $? -ne 0 ]]; then
      echo "##vso[task.complete result=Failed;]Get instances number fails."
      exit 1
    fi

    INSTANCE_NUMBER=$(echo $INSTANCE_NUMBER | tr -d '\r' | tr -d ' ')
    echo -n "##vso[task.setvariable variable=INSTANCE_NUMBER; isOutput=true]$INSTANCE_NUMBER"
  displayName: "Calculate instance number"
