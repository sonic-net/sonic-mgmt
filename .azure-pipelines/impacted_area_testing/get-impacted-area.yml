steps:
- script: |
    echo "##vso[task.setvariable variable=BUILD_BRANCH]${{ parameters.BUILD_BRANCH }}"
    sudo apt-get -o DPkg::Lock::Timeout=600 -y install jq
  displayName: "Setup environment"

- ${{ if and(ne(parameters.IMPACT_AREA_INFO, ''), ne(length(parameters.IMPACT_AREA_INFO), 0)) }}:
  - script: |
      IMPACT_AREA_INFO='${{ convertToJson(parameters.IMPACT_AREA_INFO) }}'
      echo "Input impact area info: $IMPACT_AREA_INFO"
      TEST_SCRIPTS=$(echo "$IMPACT_AREA_INFO" | jq -c '.')
      PR_CHECKERS=$(echo "${TEST_SCRIPTS}" | jq -c 'keys')
      echo "Impact area was pre-defined."
      echo "Impact area info: $IMPACT_AREA_INFO"
      echo "Pre-defined test scripts: ${TEST_SCRIPTS}"
      echo "Pre-defined PR checkers: ${PR_CHECKERS}"
      # The agent truncates any single output line at 40 KiB, which corrupts the JSON payload.
      TEST_SCRIPTS=$(printf '%s' "${TEST_SCRIPTS}" | gzip -9 | base64 -w0)
      echo "##vso[task.setvariable variable=PR_CHECKERS;isOutput=true]${PR_CHECKERS}"
      echo "##vso[task.setvariable variable=TEST_SCRIPTS;isOutput=true]${TEST_SCRIPTS}"
    name: VerifyParams
    displayName: "Process pre-defined impact area"
- ${{ else }}:
  - script: |
      echo "Impact area was not pre-defined."
      TEST_SCRIPTS=""
      PR_CHECKERS=""
      echo "##vso[task.setvariable variable=PR_CHECKERS;isOutput=true]${PR_CHECKERS}"
      echo "##vso[task.setvariable variable=TEST_SCRIPTS;isOutput=true]${TEST_SCRIPTS}"
    name: VerifyParams
    displayName: "Set empty impact area variables"


- script: |
    set -euo pipefail

    TEST_SCRIPTS='$(VerifyParams.TEST_SCRIPTS)'
    PR_CHECKERS='$(VerifyParams.PR_CHECKERS)'
    if [[ -n "$TEST_SCRIPTS" && -n "$PR_CHECKERS" ]]; then
      echo "Impact area was pre-defined, skip get diff step."
      exit 0
    fi

    # A PR build checks out the merge commit created for the PR. Its first parent is the
    # target branch tip, so diffing against it needs neither a fetch nor a merge-base,
    # which can fail to resolve in the shallow checkout.
    DIFF_BASE=""
    if [[ "$(Build.SourceBranch)" =~ ^refs/pull/[0-9]+/merge$ ]] \
        && [[ "$(git rev-parse HEAD)" == "$(Build.SourceVersion)" ]] \
        && git rev-parse -q --verify 'HEAD^2' > /dev/null; then
      DIFF_BASE=$(git rev-parse 'HEAD^1')
      echo "Diff base: first parent of the PR merge commit, ${DIFF_BASE}"
    else
      git fetch --all || echo "##vso[task.logissue type=warning]git fetch --all failed."
      if DIFF_BASE=$(git merge-base "origin/${{ parameters.BUILD_BRANCH }}" HEAD); then
        echo "Diff base: merge-base with origin/${{ parameters.BUILD_BRANCH }}, ${DIFF_BASE}"
      else
        DIFF_BASE=""
      fi
    fi

    DIFF_FOLDERS=""
    if [[ -z "$DIFF_BASE" ]]; then
      echo "##vso[task.logissue type=warning]Cannot determine the diff base, running all test scripts."
    else
      CHANGED_FILES=$(git diff --name-only "$DIFF_BASE" HEAD)
      echo "Changed files:"
      echo "$CHANGED_FILES"

      # Paths excluded from the PR trigger in azure-pipelines.yml cannot affect test
      # results, so they must not widen the impacted area. Keep the two lists in sync.
      EXCLUDED_PATHS='^(\.github|docs|sdn_tests)/|^LICENSE$|\.md$'
      IMPACT_FILES=$(grep -Ev "$EXCLUDED_PATHS" <<< "$CHANGED_FILES" || true)
      DIFF_FOLDERS=$(printf '%s' "$IMPACT_FILES" | xargs -r -d '\n' -n1 dirname | sort -u | tr '\n' ' ')
    fi

    echo "Diff folders: ${DIFF_FOLDERS}"
    echo -n "##vso[task.setvariable variable=DIFF_FOLDERS]$DIFF_FOLDERS"
  continueOnError: false
  displayName: "Get diff folders"

- script: |
    set -x

    TEST_SCRIPTS='$(VerifyParams.TEST_SCRIPTS)'
    PR_CHECKERS='$(VerifyParams.PR_CHECKERS)'
    if [[ -n "$TEST_SCRIPTS" && -n "$PR_CHECKERS" ]]; then
      echo "Impact area was pre-defined, skip get impacted area step."
      set +x
      echo "##vso[task.setvariable variable=PR_CHECKERS;isOutput=true]$PR_CHECKERS"
      echo "##vso[task.setvariable variable=TEST_SCRIPTS;isOutput=true]$TEST_SCRIPTS"
      set -x
      exit 0
    fi
    sudo uv pip install --system PyYAML natsort

    FINAL_FEATURES=""
    IFS=' ' read -ra FEATURES_LIST <<< "$(DIFF_FOLDERS)"

    # Define the list of folders include common features
    COMMON_DIRS=("tests/common" "tests/scripts")

    for FEATURE in "${FEATURES_LIST[@]}"
    do
      for COMMON_DIR in "${COMMON_DIRS[@]}"; do
        if [[ "$FEATURE" == *$COMMON_DIR* ]]; then
          FINAL_FEATURES=""
          break 2
        fi
      done

      # If changes only limited to specific feature, the scope of PR testing is impacted area.
      if [[ "$FEATURE" =~ ^tests\/.* ]]; then
        # Cut the feature path
        if [[ $FEATURE == */*/* ]]; then
            FEATURE=$(echo "$FEATURE" | cut -d'/' -f1-2)
        fi

        FEATURE=${FEATURE#tests/}

        if [[ -z "$FINAL_FEATURES" ]]; then
          FINAL_FEATURES="$FEATURE"
        elif [[ ! "$FINAL_FEATURES" == *$FEATURE* ]]; then
          FINAL_FEATURES="$FINAL_FEATURES,$FEATURE"
        fi

      # If changes related to other folders excpet tests, we also consider them as common part.
      # The scope of PR testing is all test scripts.
      else
        FINAL_FEATURES=""
        break
      fi
    done

    # Generate TEST_SCRIPTS with retry logic for JSON validation
    MAX_RETRIES=3
    RETRY_COUNT=0

    # Drop control-plane tests duplicated between checkers only in PR builds,
    # so the scheduled baseline keeps running every script on every topology.
    DEDUP_ARG=""
    if [[ "$(Build.Reason)" == "PullRequest" ]]; then
      DEDUP_ARG="--dedup-control-plane"
    fi

    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      echo "Attempt $((RETRY_COUNT + 1)): Generating test scripts..."

      TEST_SCRIPTS=$(python3 ./.azure-pipelines/impacted_area_testing/get_test_scripts.py --features ${FINAL_FEATURES} --location tests ${DEDUP_ARG})

      if [[ $? -ne 0 ]]; then
        echo "Get test scripts command failed on attempt $((RETRY_COUNT + 1))"
        RETRY_COUNT=$((RETRY_COUNT + 1))
        if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
          echo "Retrying in 2 seconds..."
          sleep 2
        fi
        continue
      fi

      # Validate TEST_SCRIPTS is valid JSON
      if echo "$TEST_SCRIPTS" | jq empty > /dev/null 2>&1; then
        echo "TEST_SCRIPTS is valid JSON, script count per checker:"
        echo "$TEST_SCRIPTS" | jq -r 'to_entries[] | "  \(.key): \(.value | length)"'

        # Generate PR_CHECKERS
        PR_CHECKERS=$(echo "${TEST_SCRIPTS}" | jq -c 'keys')

        if [[ $? -eq 0 ]] && echo "$PR_CHECKERS" | jq empty > /dev/null 2>&1; then
          echo "PR_CHECKERS is valid list: $PR_CHECKERS"
          echo "All validations passed successfully"
          break
        else
          echo "PR_CHECKERS generation failed or invalid list: $PR_CHECKERS"
        fi
      else
        echo "TEST_SCRIPTS is not valid JSON: $(echo "$TEST_SCRIPTS" | head -c 2000)"
      fi

      RETRY_COUNT=$((RETRY_COUNT + 1))
      if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
        echo "Retrying in 2 seconds..."
        sleep 2
      fi
    done

    # Final validation
    if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
      echo "##vso[task.complete result=Failed;]Failed to generate valid JSON after $MAX_RETRIES attempts. Last TEST_SCRIPTS: $(echo "$TEST_SCRIPTS" | head -c 2000)"
      exit 1
    fi

    # The agent truncates any single output line at 40 KiB, which corrupts the JSON payload.
    TEST_SCRIPTS=$(printf '%s' "$TEST_SCRIPTS" | gzip -9 | base64 -w0)

    set +x
    echo "##vso[task.setvariable variable=PR_CHECKERS;isOutput=true]$PR_CHECKERS"
    echo "##vso[task.setvariable variable=TEST_SCRIPTS;isOutput=true]$TEST_SCRIPTS"
    set -x
  name: SetVariableTask
  continueOnError: false
  displayName: "Get impacted area"
