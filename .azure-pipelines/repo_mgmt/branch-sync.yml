
name: SyncAndMerge$(Build.DefinitionName)_$(SourceBranchName)_$(Build.BuildId)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  - group: sonicbld

schedules:
  - cron: "30 2 * * *"
    displayName: Sync and Merge
    branches:
      include:
        - internal
    always: true

parameters:
  - name: SychJobs
    type: object
    default:
      Chassis_202405:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202405"
        TARGET_BRANCH: "internal-202405-chassis"
        PUSH_BRANCH: "internal-202405-chassis"
      AI_202412:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202412"
        TARGET_BRANCH: "internal-202412"
        PUSH_BRANCH: "internal-202412"
      Chassis_202503:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202503"
        TARGET_BRANCH: "internal-202503-chassis"
        PUSH_BRANCH: "internal-202503-chassis"
      MSFT_202506:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202506"
        TARGET_BRANCH: "internal-202506"
        PUSH_BRANCH: "internal-202506"
      MSFT_202511_AZD:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202511_azd"
        TARGET_BRANCH: "internal-202511-azd"
        PUSH_BRANCH: "internal-202511-azd"
      DT2_202512:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202512"
        TARGET_BRANCH: "internal-202512"
        PUSH_BRANCH: "internal-202512"
      MSFT_202603:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202603"
        TARGET_BRANCH: "internal-202603"
        PUSH_BRANCH: "internal-202603"
      MSFT_202606:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202606"
        TARGET_BRANCH: "internal-202606"
        PUSH_BRANCH: "internal-202606"
      MSFT_202607:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202607"
        TARGET_BRANCH: "internal-202607"
        PUSH_BRANCH: "internal-202607"
      MSFT_202608:
        SOURCE_REPO: "https://github.com/Azure/sonic-mgmt.msft.git"
        SOURCE_BRANCH: "202608"
        TARGET_BRANCH: "internal-202608"
        PUSH_BRANCH: "internal-202608"
    displayName: "Branches to sync and merge"

stages:
  - stage: SyncAndMerge
    jobs:
      - job: SyncBranches
        strategy:
          maxParallel: 5
          matrix:
            ${{ parameters.SychJobs }}

        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              set -ex

              echo "=== Prepare git branchs for merge ==="
              git config --global user.email "mssonic@microsoft.com"
              git config --global user.name "Internal Build Service"

              git fetch origin

              echo "Add remote for source repo."
              git remote add source $(SOURCE_REPO)
              git fetch source

              echo "Checkout a temp branch 'foo', so that we can cleanup the branches to be worked on."
              git checkout -b foo origin/internal || true
              git branch -D $(TARGET_BRANCH) || true

              echo "Checkout the target branch to be worked on."
              git checkout -b $(TARGET_BRANCH) origin/$(TARGET_BRANCH)
              git branch -D foo || true  # Cleanup the temp 'foo' branch.
            displayName: Prepare git

          - script: |
              set -e

              echo "=== Sync source branch to target branch ==="
              merge_rc=0
              git merge --no-edit source/$(SOURCE_BRANCH) || merge_rc=$?

              unmerged_paths=$(git diff --name-only --diff-filter=U)
              if [[ $merge_rc -ne 0 && -n "$unmerged_paths" ]]; then
                echo "##vso[task.logissue type=warning]Code sync conflict: source/$(SOURCE_BRANCH) -> origin/$(TARGET_BRANCH)"
                echo "======Unmerged paths for $(TARGET_BRANCH)======"
                echo "$unmerged_paths"

                head_commit=$(git rev-parse source/$(SOURCE_BRANCH))
                client="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                payload=$(python3 -c 'import json, sys; print(json.dumps({"name": "code_conflict", "repo": sys.argv[1], "branch": sys.argv[2], "commit": sys.argv[3], "client": sys.argv[4]}))' \
                  "sonic-mgmt-int" \
                  "$(TARGET_BRANCH)" \
                  "$head_commit" \
                  "$client")

                set +x
                cert_pfx="$(mktemp -t cert.XXXXXX.pfx)"
                trap 'rm -f "$cert_pfx"' EXIT
                printf '%s' "$CERT" | base64 -d > "$cert_pfx"
                cert=$(openssl pkcs12 -in "$cert_pfx" -nokeys -nodes -passin pass: | openssl x509 -noout -fingerprint -sha1 | sed 's/^.*=//' | tr -d ':' | tr 'A-Z' 'a-z')
                notification_rc=0
                response=$(curl --fail-with-body --silent --show-error \
                  -H 'Content-Type: application/json' \
                  -H "thumbprint: $cert" \
                  -X POST https://notice-center.azurewebsites.net/noti_center/notice \
                  -d "$payload") || notification_rc=$?
                if [[ $notification_rc -eq 0 ]]; then
                  RESPONSE="$response" python3 -c 'import json, os, sys; sys.exit(0 if json.loads(os.environ["RESPONSE"]).get("success") is True else 1)' || notification_rc=$?
                fi
                set -x

                if [[ $notification_rc -ne 0 ]]; then
                  echo "##vso[task.logissue type=warning]Failed to send the code sync conflict notification"
                fi
              fi

              exit $merge_rc
            env:
              CERT: $(cert-noti)
            displayName: "Merge branch"

          - script: |
              set -ex

              echo "=== Push the merged branch to remote ==="
              git push origin $(TARGET_BRANCH):$(PUSH_BRANCH)
            displayName: "Push branch"
