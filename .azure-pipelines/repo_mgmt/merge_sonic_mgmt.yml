
name: RepoMerge_$(Build.DefinitionName)_$(SourceBranchName)_$(Build.BuildId)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  - group: sonicbld

schedules:
  - cron: "30 2 * * *"
    displayName: Merge Github to sonic-mgmt-int
    branches:
      include:
        - internal
    always: true

parameters:
  - name: GITHUB_BRANCH
    type: string
    default: master
    displayName: "Github branch name"

  - name: LOCAL_BRANCH
    type: string
    default: internal
    displayName: "Local branch name of sonic-mgmt-int"

  - name: PUSH_BRANCH
    type: string
    default: internal-stage
    displayName: "Push to this branch after merge is done"

stages:

  - stage: RepoMerge
    jobs:

      - job: sonic_mgmt_merge
        timeoutInMinutes: 30
        variables:
          - name: skipComponentGovernanceDetection
            value: true

        steps:

          - checkout: self
            persistCredentials: true

          - script: |
              set -e
              force=""
              if [ "${{ parameters.PUSH_BRANCH }}" == "internal-stage" ]; then
                force="-f"
              fi

              merge_rc=0
              /bin/bash .azure-pipelines/repo_mgmt/merge.sh \
                -g ${{ parameters.GITHUB_BRANCH }} \
                -l ${{ parameters.LOCAL_BRANCH }} \
                -p ${{ parameters.PUSH_BRANCH }} \
                ${force} || merge_rc=$?

              if [[ $merge_rc -eq 12 ]]; then
                head_commit=$(git rev-parse github/${{ parameters.GITHUB_BRANCH }})
                client="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                payload=$(python3 -c 'import json, sys; print(json.dumps({"name": "code_conflict", "repo": sys.argv[1], "branch": sys.argv[2], "commit": sys.argv[3], "client": sys.argv[4], "upstream_repo": sys.argv[5], "upstream_branch": sys.argv[6]}))' \
                  "sonic-mgmt-int" \
                  "${{ parameters.LOCAL_BRANCH }}" \
                  "$head_commit" \
                  "$client" \
                  "sonic-net/sonic-mgmt" \
                  "${{ parameters.GITHUB_BRANCH }}")

                set +x
                cert_pfx="$(mktemp -t cert.XXXXXX.pfx)"
                trap 'rm -f "$cert_pfx"' EXIT
                printf '%s' "$CERT" | base64 -d > "$cert_pfx"
                cert=$(openssl pkcs12 -in "$cert_pfx" -nokeys -nodes -passin pass: | openssl x509 -noout -fingerprint -sha1 | sed 's/^.*=//' | tr -d ':' | tr 'A-Z' 'a-z')
                notification_rc=0
                response=$(curl --fail-with-body --silent --show-error \
                  -H 'Content-Type: application/json' \
                  -H "thumbprint: $cert" \
                  -X POST https://notice-center.azurewebsites.net/noti_center/notice \
                  -d "$payload") || notification_rc=$?
                if [[ $notification_rc -eq 0 ]]; then
                  RESPONSE="$response" python3 -c 'import json, os, sys; sys.exit(0 if json.loads(os.environ["RESPONSE"]).get("success") is True else 1)' || notification_rc=$?
                fi
                set -x

                if [[ $notification_rc -ne 0 ]]; then
                  echo "##vso[task.logissue type=warning]Failed to send the code sync conflict notification"
                fi
              fi

              exit $merge_rc
            env:
              CERT: $(cert-noti)
            displayName: Merge sonic-mgmt
