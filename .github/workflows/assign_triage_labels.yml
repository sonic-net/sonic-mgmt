name: "Assign Triage Labels"

on:
  pull_request_target:
    types: [opened, reopened]
  # Backstop: catches PRs opened while this workflow was failing or disabled,
  # and lets historic PRs be labelled on demand.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      scan_limit:
        description: 'Maximum number of open PRs to scan (0 = no limit)'
        required: false
        default: '0'
      dry_run:
        description: 'Log the assignments without applying them'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign_triage_labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyaml PyGithub
      - name: Assign triage labels
        run: python .github/triage-assign/assign_triage_labels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for the scheduled/manual runs, which scan open PRs instead.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # sonic-net/sonic-contributor-map is a private repository, so the
          # default GITHUB_TOKEN cannot read it. Without this secret the script
          # falls back to the username suffix heuristic in companies.yml.
          CONTRIBUTOR_MAP_TOKEN: ${{ secrets.CONTRIBUTOR_MAP_TOKEN }}
          TRIAGE_CONFIG_PATH: .github/triage-assign/companies.yml
          SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Cleanup the checked out repo
        run: git clean -fdx
