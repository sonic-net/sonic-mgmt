name: "Assign Triage Labels"

on:
  pull_request_target:
    types: [opened, reopened]
  # Backstop: catches PRs opened while this workflow was failing or disabled,
  # and lets historic PRs be labelled on demand.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      scan_limit:
        description: 'Maximum number of open PRs to scan (0 = no limit)'
        required: false
        default: '0'
      dry_run:
        description: 'Log the assignments without applying them'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign_triage_labels:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs: mutable tags can be silently
      # repointed by the action owner (enforced by the Semgrep CI check).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyaml PyGithub requests
      - name: Assign triage labels
        run: python .github/triage-assign/assign_triage_labels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for the scheduled/manual runs, which scan open PRs instead.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIAGE_CONFIG_PATH: .github/triage-assign/companies.yml
          SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Cleanup the checked out repo
        run: git clean -fdx
