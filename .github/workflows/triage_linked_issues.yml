name: "Triage Linked Issues"

# When a pull request is linked to an issue it will close ("Fixes #123",
# "Closes #123", or the PR's Development sidebar), label the issue "Triaged"
# and "auto-triaged" and assign it to the PR author; when the PR is closed
# without merging, undo that. See .github/triage-assign/triage_linked_issues.py.

on:
  pull_request_target:
    # "edited" catches closing keywords added to the description after opening;
    # "closed" undoes the automatic triage when the PR is closed unmerged.
    types: [opened, reopened, edited, closed]
  # GitHub fires no event for links made from the Development sidebar, so a
  # weekly scan of untriaged issues with a linked PR picks those up.
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
    inputs:
      scan_limit:
        description: 'Maximum number of issues to scan (0 = no limit)'
        required: false
        default: '0'
      dry_run:
        description: 'Log the changes without applying them'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: write

# Serializes the bursts of "edited" events a PR fires while its description is
# filled in. The script works from the PR's current state, so a superseded
# pending run is safe to drop.
concurrency:
  group: triage-linked-issues-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage_linked_issues:
    if: github.repository_owner == 'sonic-net'
    runs-on: ubuntu-latest
    steps:
      # Checks out the base branch, never the PR head: no PR-authored code runs
      # under pull_request_target. Actions are pinned to full commit SHAs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Triage linked issues
        run: python .github/triage-assign/triage_linked_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for the scheduled/manual runs, which scan issues instead.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIAGED_LABEL: Triaged
          AUTO_TRIAGED_LABEL: auto-triaged
          SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Cleanup the checked out repo
        run: git clean -fdx
