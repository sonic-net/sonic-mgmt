# Configuration for the "Assign Triage Labels" workflow
# (.github/workflows/assign_triage_labels.yml).
#
# Every pull request gets `assignments_per_pr` labels of the form
# "<label_prefix><company name>", picked at random from the companies listed
# below, excluding the company the PR author belongs to.
#
# On top of those, it gets each label under `topic_labels` (at the bottom)
# whose keywords appear in its title or changed file paths.

label_prefix: "triage-"
assignments_per_pr: 2

# Organization values in the author map that mean "unknown", rather than "some
# company other than the ones below". Authors carrying one of these are treated
# as absent from the map, so the username suffix heuristic still gets a shot --
# without this, the ~30 suffixed authors the CSV files under "Others" would
# never be matched to their company. "author_org_dup" is a placeholder the CSV
# uses on some duplicated rows.
unknown_organizations:
  - Others
  - author_org_dup

companies:
  - name: Arista
    # Matched (case-insensitively) against the "Organization" column of
    # sii_author_predict.csv in sonic-net/sonic-tsc.
    organizations:
      - Arista
    # Fallback heuristic used when the author map is unavailable or does not
    # list the PR author: a GitHub username ending in one of these suffixes is
    # treated as belonging to this company.
    username_suffixes:
      - "-arista"

  - name: Cisco
    organizations:
      - Cisco
    username_suffixes:
      - "-cisco"
      - "-csco"

  - name: Microsoft
    organizations:
      - Microsoft
    username_suffixes:
      - "-microsoft"
      - "-msft"

  - name: Nexthop
    organizations:
      - Nexthop
      - Nexthop Systems
    username_suffixes:
      - "-nexthop"

# Extra author -> company mappings applied on top of the author map.
# Useful for people the (possibly stale) map has not caught up with yet, and
# for people whose username carries no company suffix.
# Keys are GitHub usernames (case-insensitive), values are company names from
# the list above.
overrides:
  # octocat: Nexthop

# Labels added on top of the company labels when a pull request is about a
# given area. A label is added when any of its keywords appears as a whole
# token (case-insensitive; tokens are split on anything that is not a letter
# or digit) in the PR title or in the path of any file the PR changes. So "t2"
# matches "[T2] fix ..." and "ansible/vars/topo_t2_2lc.yml", but not "test2".
# Changed files under any of a label's `exclude_paths` (path prefixes) are not
# matched; the title still is.
topic_labels:
  - label: chassis
    # The platform API names its root object "chassis" on every device, so
    # these generic platform API tests and helpers are not chassis work.
    exclude_paths:
      - tests/platform_tests/api/
      - tests/common/helpers/platform_api/
    keywords:
      # Chassis / VOQ
      - chassis
      - linecard
      - voq
      # T2 topology family
      - t2
      - ft2
      - lt2
      - ut2
      # Regional Hub (RH) topologies: lower, upper and disaggregated
      - rh
      - lrh
      - urh
      - drh
