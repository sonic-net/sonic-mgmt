releases:
  includes:
    - '^202\d{3}$'
  excludes:
    - "202305"
    - "202311"
    - "202211"
    - "202205"
    - "202012"

expiry:
  # Must stay below days-before-stale in .github/workflows/close-stale.yml: the
  # stale bot only exempts skip-tracked issues once they carry the expired label.
  default_days: 90

report:
  warning_days: [30, 15, 7, 3, 1]
