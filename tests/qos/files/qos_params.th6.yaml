qos_params:
    th6:
        topo-t0-standalone: &topo-t0-standalone
            cell_size: 420
            hdrm_pool_wm_multiplier: 1
            # Sized for the NH-4210 ingress service pool (305,950 cells; one
            # PG alone XOFFs at ~153,448). Lossless PGs are ALPHA_1, so the
            # last PG XOFFs at (pool - filled) / 2. Its count lands ~845 cells
            # past that, inside the smallest (30m, 1,697-cell) PG headroom.
            # The test sends 1 + 2 * pkts_num_margin for the last PG and
            # subtracts the margin from pkt_counts[-2], so the margin sets the
            # last count. shared_limit_bytes only sanity-checks the counts and
            # is the midpoint between the pre-final and total byte sums.
            shared_res_size_1:
                ecn: 1
                packet_size: 1500
                cell_size: 420
                pkts_num_margin: 13538
                dscps: [3, 4]
                pgs: [3, 4]
                queues: [3, 4]
                src_port_i: [0, 1]
                dst_port_i: [3, 4]
                pkt_counts: [36538, 1]
                shared_limit_bytes: 61384680
            # dscp 5 maps to lossy PG 0 (AZURE), which never sends PFC; reuse
            # PG 3 on a third port as the last PG instead.
            shared_res_size_2:
                ecn: 1
                packet_size: 1500
                cell_size: 420
                pkts_num_margin: 11789
                dscps: [3, 4, 3]
                pgs: [3, 4, 3]
                queues: [3, 4, 3]
                src_port_i: [0, 1, 2]
                dst_port_i: [3, 4, 5]
                pkt_counts: [15000, 26789, 1]
                shared_limit_bytes: 70206360
            pg_min_threshold:
                pg0_dscp: 3
                pg1_dscp: 4
                pg0: 3
                pg1: 4
                packet_size: 64
                cell_size: 420
                pg1_min_size: 126000
                pg_pkts_to_fill: 220000
                pkt_count_tolerance: 100
            800000_500m:
                hdrm_pool_size:
                    dscps:
                    - 3
                    - 4
                    dst_port_id: 0
                    ecn: 1
                    margin: 100
                    pgs:
                    - 3
                    - 4
                    pgs_num: 2
                    pkts_num_hdrm_full: 8867 # Actual Heardoom pool size - 1 (One packet is sent to detect the PFC)
                    pkts_num_hdrm_partial: 8500 # Headroom Partial < Actual Heardoom pool size < Headroom Partial + 2 * margin + 1
                    pkts_num_trig_pfc: 209000
                    pkts_num_trig_pfc_multi: # Max packets that can be sent without invoking PFC.
                    - 209000
                    - 104950
                    src_port_ids:
                    - 0
