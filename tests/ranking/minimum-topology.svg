<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 348" role="img" aria-labelledby="title desc">
  <title id="title">Ranking Test minimum topology</title>
  <desc id="desc">A controller reaches the PTF host and DUT over SSH. The PTF Thrift client calls the DUT Thrift server over TCP 9092. Front-panel links carry test packets between the PTF host and DUT.</desc>
  <defs>
    <marker id="ssh-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L7 4L0 8Z" fill="#5a6b7d"/>
    </marker>
    <marker id="rpc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#235f9c"/>
    </marker>
    <marker id="packet-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 5L0 10Z" fill="#196d55"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#192533">
    <rect x="222" y="12" width="216" height="66" rx="9" fill="#edf3f9" stroke="#9aafc4"/>
    <text x="330" y="40" font-size="19" font-weight="650">Test controller</text>
    <text x="330" y="62" font-size="14">pytest · orchestration and report</text>

    <g fill="none" stroke="#5a6b7d" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ssh-arrow)">
      <path d="M270 78V108H121V149"/>
      <path d="M390 78V108H539V149"/>
    </g>
    <g fill="#405063" font-size="14">
      <text x="178" y="100">SSH</text>
      <text x="482" y="100">SSH</text>
    </g>

    <g fill="#f7f9fc" stroke="#9aafc4">
      <rect x="12" y="150" width="218" height="180" rx="9"/>
      <rect x="430" y="150" width="218" height="180" rx="9"/>
    </g>
    <g font-size="18" font-weight="650">
      <text x="121" y="176">PTF host</text>
      <text x="539" y="176">DUT</text>
    </g>
    <g fill="#ffffff" stroke="#c1cedc" stroke-dasharray="4 3">
      <rect x="26" y="188" width="190" height="86" rx="6"/>
      <rect x="444" y="188" width="190" height="86" rx="6"/>
    </g>
    <g font-size="15">
      <text x="121" y="211" font-weight="650">PTF container</text>
      <text x="121" y="235">Packet Test Framework</text>
      <text x="121" y="255">SAI Thrift client</text>
      <text x="539" y="211" font-weight="650">SAIserver container</text>
      <text x="539" y="235">SAI Thrift server</text>
      <text x="539" y="255">Vendor SAI / SDK</text>
    </g>
    <path d="M216 247H443" fill="none" stroke="#235f9c" stroke-width="2" marker-end="url(#rpc-arrow)"/>
    <text x="330" y="237" fill="#235f9c" font-size="15" font-weight="600">SAI Thrift RPC</text>
    <text x="330" y="266" fill="#235f9c" font-size="14">TCP 9092</text>

    <text x="121" y="314" font-size="15">Front-panel ports</text>
    <text x="539" y="314" font-size="15">ASIC / front-panel ports</text>
    <path d="M232 309H428" fill="none" stroke="#196d55" stroke-width="2.5" marker-start="url(#packet-arrow)" marker-end="url(#packet-arrow)"/>
    <text x="330" y="298" fill="#196d55" font-size="15" font-weight="600">Packet data path</text>
    <text x="330" y="329" fill="#196d55" font-size="14">Physical links</text>
  </g>
</svg>
