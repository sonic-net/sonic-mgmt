schema_version: 1
type: sonic_sonic

controller:
  testbed: ranking
  host_pattern: all
  connection: ssh

hosts:
  dut:
    name: sonic-dut
    address: 192.0.2.10
    user: root
  ptf:
    name: sonic-ptf
    address: 192.0.2.20
    user: root

dut:
  rpc_port: 9092

ptf:
  container: saiserverv2
  workdir: /SAI-TEST
  executable: /SAI-TEST/test/ptf/ptf
  case_dir: /SAI-TEST/ptf
  binding_dir: /usr/lib/python3/dist-packages
  collector_dir: /tmp/sai_test_results
  timeout_s: 180
  arguments:
    - --relax

ports:
  Ethernet1: {id: 1, interface: Ethernet1}
