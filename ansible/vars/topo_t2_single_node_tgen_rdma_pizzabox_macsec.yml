topology:
  # 1 DUT - NH-5010 Pizzabox (single node, single-asic) for RDMA/Snappi MACsec testing
  # 4x 400G links to IXIA (svc5-ixia-2 Card1/Port1-Port4)
  #
  #   - Ethernet8   (port 2) -> IXIA Card1/Port1 (400G)
  #   - Ethernet12  (port 3) -> IXIA Card1/Port2 (400G)
  #   - Ethernet16  (port 4) -> IXIA Card1/Port3 (400G)
  #   - Ethernet20  (port 5) -> IXIA Card1/Port4 (400G)
  #
  # No ptf ports, this is to setup the DUT for Ixia RDMA testing.

  dut_num: 1
  VMs:
    VM01T3:
      vlans:
        - 0.2@2
      vm_offset: 0
    VM02T3:
      vlans:
        - 0.3@3
      vm_offset: 1
    VM03LT2:
      vlans:
        - 0.4@4
      vm_offset: 2
    VM04LT2:
      vlans:
        - 0.5@5
      vm_offset: 3
  DUT:
    loopback:
      ipv4:
        - 10.1.0.1/32
      ipv6:
        - FC00:10::1/128

configuration_properties:
  common:
    podset_number: 400
    tor_number: 16
    tor_subnet_number: 8
    max_tor_subnet_number: 32
    tor_subnet_size: 128
    dut_asn: 65100
    dut_type: UpperSpineRouter
    nhipv4: 10.10.246.254
    nhipv6: FC0A::FF
  core:
    swrole: core
  leaf:
    swrole: leaf

configuration:
  VM01T3:
    properties:
      - common
      - core
    bgp:
      asn: 65200
      peers:
        65100:
          - 10.1.1.0
          - FC00:1::1
    interfaces:
      Loopback0:
        ipv4: 100.1.0.1/32
        ipv6: 2064:100::1/128
      Ethernet1:
        ipv4: 10.1.1.1/31
        ipv6: FC00:1::2/126
        dut_index: 0
    bp_interface:
      ipv4: 10.10.246.1/24
      ipv6: fc0a::2/64

  VM02T3:
    properties:
      - common
      - core
    bgp:
      asn: 65200
      peers:
        65100:
          - 10.1.2.0
          - FC00:2::1
    interfaces:
      Loopback0:
        ipv4: 100.1.0.3/32
        ipv6: 2064:100::3/128
      Ethernet1:
        ipv4: 10.1.2.1/31
        ipv6: FC00:2::2/126
        dut_index: 0
    bp_interface:
      ipv4: 10.10.246.3/24
      ipv6: fc0a::6/64

  VM03LT2:
    properties:
      - common
      - leaf
    bgp:
      asn: 65200
      peers:
        65100:
          - 10.1.3.0
          - FC00:3::1
    interfaces:
      Loopback0:
        ipv4: 100.1.0.4/32
        ipv6: 2064:100::4/128
      Ethernet1:
        ipv4: 10.1.3.1/31
        ipv6: FC00:3::2/126
        dut_index: 0
    bp_interface:
      ipv4: 10.10.246.4/24
      ipv6: fc0a::9/64

  VM04LT2:
    properties:
      - common
      - leaf
    bgp:
      asn: 65200
      peers:
        65100:
          - 10.1.4.0
          - FC00:4::1
    interfaces:
      Loopback0:
        ipv4: 100.1.0.6/32
        ipv6: 2064:100::6/128
      Ethernet1:
        ipv4: 10.1.4.1/31
        ipv6: FC00:4::2/126
        dut_index: 0
    bp_interface:
      ipv4: 10.10.246.6/24
      ipv6: fc0a::d/64
