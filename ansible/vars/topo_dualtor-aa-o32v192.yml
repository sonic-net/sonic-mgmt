    - 0.18@18,1.18@18
    - 0.19@19,1.19@19
    - 0.20@20,1.20@20
    - 0.21@21,1.21@21
    - 0.22@22,1.22@22
    - 0.23@23,1.23@23
    - 0.24@24,1.24@24
    - 0.25@25,1.25@25
    - 0.26@26,1.26@26
    - 0.27@27,1.27@27
    - 0.30@30,1.30@30
    - 0.31@31,1.31@31
    - 0.32@32,1.32@32
    - 0.33@33,1.33@33
  disabled_host_interfaces:
    - 0.30@30,1.30@30
    - 0.31@31,1.31@31
    - 0.32@32,1.32@32
    - 0.33@33,1.33@33
  host_interfaces_active_active:
