# Arista-7060X6-64PE-B-O32V192: retain 32x400G + 192x200G breakout.
# DUT indices are zero-based positions in the HWSKU port_alias list.
# Active downlinks: 2-13 / 16-27 (etp2a-4d / etp6a-8d), all 200G.
# Uplinks: 0 / 14 / 28 / 42 (etp1a / etp5a / etp9a / etp13a), all 400G.
# Disabled host ports: 30-33 (etp10a-d). Other ports are outside this test topology.
# Keep host PTF indices equal to DUT indices for NIC simulator mux-fact lookup.
topology:
  dut_num: 2
  host_interfaces:
    - 0.2@2,1.2@2
    - 0.3@3,1.3@3
    - 0.4@4,1.4@4
    - 0.5@5,1.5@5
