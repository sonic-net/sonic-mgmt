    - 0.3@3,1.3@3
    - 0.4@4,1.4@4
    - 0.5@5,1.5@5
    - 0.6@6,1.6@6
    - 0.7@7,1.7@7
    - 0.8@8,1.8@8
    - 0.9@9,1.9@9
    - 0.10@10,1.10@10
