    podset_number: 400
    tor_number: 16
    tor_subnet_number: 8
    max_tor_subnet_number: 32
    tor_subnet_size: 128
    dut_asn: 64588
    dut_confed_asn: 64582
    dut_confed_peers: 64589
    dut_type: UpperMgmtAggregator
    nhipv4: 10.10.246.254
    nhipv6: fc0a::ff
  core:
    swrole: core
    device_type: RegionalWANAggregator
  lma:
    swrole: leaf
    device_type: LowerMgmtAggregator     # VM02-05LMA (confed peers)
  m1:
    swrole: leaf
    device_type: MgmtLeafRouter          # VM06M1 (external downstream)

