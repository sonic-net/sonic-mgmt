- name: create directory for sonic config
  become: yes
  file:
    path: "/{{ csonic_image_mount_dir }}/csonic_{{ vm_set_name }}_{{ inventory_hostname }}/sonic"
    state: directory
  delegate_to: "{{ VM_host[0] }}"

- name: create config db
  become: yes
  template:
    src: "{{ lookup('first_found', _csonic_configdb_candidates) }}"
    dest: "/{{ csonic_image_mount_dir }}/csonic_{{ vm_set_name }}_{{ inventory_hostname }}/sonic/config_db.json"
  vars:
    _csonic_configdb_candidates:
      files:
        - "configdb-{{ topo }}-{{ props.swrole | default('') }}.j2"
        - "configdb-{{ props.swrole | default('') }}.j2"
        - "configdb-csonic.j2"
      paths:
        - "{{ role_path }}/templates"
  delegate_to: "{{ VM_host[0] }}"
  when: not (topo_is_multi_vrf | default(false) | bool)

- name: create converged cSONiC config db
  become: yes
  template:
    src: configdb-csonic-converged.j2
    dest: "/{{ csonic_image_mount_dir }}/csonic_{{ vm_set_name }}_{{ inventory_hostname }}/sonic/config_db.json"
  delegate_to: "{{ VM_host[0] }}"
  when: topo_is_multi_vrf | default(false) | bool

- name: copy userspace OVS LAG helper
  become: yes
  copy:
    src: csonic_ovs_lag.py
    dest: "/{{ csonic_image_mount_dir }}/csonic_{{ vm_set_name }}_{{ inventory_hostname }}/sonic/csonic_ovs_lag.py"
    mode: '0755'
  delegate_to: "{{ VM_host[0] }}"
  when: csonic_lag_backend == 'userspace_ovs'

- name: copy converged cSONiC supervisor entrypoint
  become: yes
  copy:
    src: csonic_supervisord_entrypoint.sh
    dest: "/{{ csonic_image_mount_dir }}/csonic_{{ vm_set_name }}_{{ inventory_hostname }}/sonic/csonic_supervisord_entrypoint.sh"
    mode: '0755'
  delegate_to: "{{ VM_host[0] }}"
  when: topo_is_multi_vrf | default(false) | bool

- name: copy converged cSONiC FRR daemon supervisor definitions
  become: yes
  copy:
    src: csonic_frr_daemons.conf
    dest: "/{{ csonic_image_mount_dir }}/csonic_{{ vm_set_name }}_{{ inventory_hostname }}/sonic/csonic_frr_daemons.conf"
    mode: '0644'
  delegate_to: "{{ VM_host[0] }}"
  when: topo_is_multi_vrf | default(false) | bool

# NOTE: cSONiC FRR configuration is generated by bgpcfgd from CONFIG_DB
# (BGP_NEIGHBOR entries in config_db.json), the same path as production SONiC.
# Only the /sonic directory is bind-mounted into the container; an frr/
# directory would not be consumed, so no FRR/zebra/daemons/vtysh files are
# rendered here.
