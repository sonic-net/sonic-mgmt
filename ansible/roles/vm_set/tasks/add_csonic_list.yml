- name: Build VM name to topo VM name mapping
  set_fact:
    vm_inv_to_topo: >-
      {{ vm_inv_to_topo | default({}) | combine({
           VM_hosts[VM_hosts.index(VM_base) + item.value.vm_offset]: item.key
         }) }}
  loop: "{{ topology.VMs | dict2items }}"
  loop_control:
    loop_var: item

- name: Validate cSONiC LAG backend
  assert:
    that:
      - csonic_lag_backend in ['teamd', 'userspace_ovs']
    fail_msg: >-
      Unsupported csonic_lag_backend={{ csonic_lag_backend }};
      expected teamd or userspace_ovs

- name: Create temporary userspace OVS image build context
  become: yes
  tempfile:
    state: directory
    suffix: csonic-userspace-ovs
  register: csonic_ovs_build_context
  when: csonic_lag_backend == 'userspace_ovs'

- name: Copy userspace OVS Dockerfile to VM host
  become: yes
  copy:
    src: csonic-userspace-ovs.Dockerfile
    dest: "{{ csonic_ovs_build_context.path }}/Dockerfile"
    mode: '0644'
  when: csonic_lag_backend == 'userspace_ovs'

- name: Build cSONiC userspace OVS image
  become: yes
  docker_image:
    name: "{{ csonic_userspace_ovs_image }}"
    source: build
    force_source: yes
    build:
      path: "{{ csonic_ovs_build_context.path }}"
      args:
        CSONIC_BASE_IMAGE: "{{ csonic_image }}"
  when: csonic_lag_backend == 'userspace_ovs'

- name: Remove temporary userspace OVS image build context
  become: yes
  file:
    path: "{{ csonic_ovs_build_context.path }}"
    state: absent
  when: csonic_lag_backend == 'userspace_ovs'

- name: Create VMs network
  become: yes
  vm_topology:
    cmd:          'create'
    vm_names:     "{{ VM_hosts }}"
    fp_mtu:       "{{ fp_mtu_size }}"
    max_fp_num:   "{{ max_fp_num }}"

- name: Add OVS flow rules for VM bridges
  become: yes
  command: "ovs-ofctl add-flow br-{{ vm_item }}-{{ topology.VMs[vm_inv_to_topo[vm_item]].vm_offset }} action=normal"
  loop: "{{ VM_targets }}"
  loop_control:
    loop_var: vm_item
  failed_when: false
  when: csonic_lag_backend == 'teamd'

- include_tasks: add_csonic.yml
  loop: "{{ VM_targets }}"
  loop_control:
    loop_var: vm_item
