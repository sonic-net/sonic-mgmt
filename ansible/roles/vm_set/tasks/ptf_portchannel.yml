---
- name: Set ptf host
  set_fact:
    ptf_host: "{{ ptf_ip.split('/')[0] }}"
    ptf_host_ip: "{{ ptf_ip.split('/')[0] }}"

- name: Add ptf host
  add_host:
    name: "{{ ptf_host }}"
    groups:
      - ptf

# With ptf_emulated_lacp_hosts, DUT.portchannel_config only describes DUT-side LAGs; the PTF LAGs come from ptf_emulated_lacp_hosts.
- name: find downlink portchannel configuration
  set_fact:
    portchannel_config: "{{ {} if topology['ptf_emulated_lacp_hosts'] is defined else (topology['DUT']['portchannel_config'] | default({})) }}"

- name: find portchannel mode
  set_fact:
    portchannel_mode: "{{ topology['DUT']['portchannel_mode'] | default('teamd') }}"

- name: Start PTF portchannel
  ptf_portchannel:
    cmd: start
    portchannel_config: "{{ portchannel_config }}"
    mode: "{{ portchannel_mode }}"
    ptf_emulated_lacp_hosts: "{{ topology['ptf_emulated_lacp_hosts'] | default([]) }}"
  delegate_to: "{{ ptf_host }}"
  when: ptf_portchannel_action == 'start'

- name: Stop PTF portchannel
  ptf_portchannel:
    cmd: stop
    portchannel_config: "{{ portchannel_config }}"
    mode: "{{ portchannel_mode }}"
    ptf_emulated_lacp_hosts: "{{ topology['ptf_emulated_lacp_hosts'] | default([]) }}"
  delegate_to: "{{ ptf_host }}"
  ignore_unreachable: yes
  when: ptf_portchannel_action == 'stop'
