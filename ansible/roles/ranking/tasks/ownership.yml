- name: Build the DUT claim request
  ansible.builtin.set_fact:
    ranking_dut_claim_request:
      action: claim
      resource: '{{ ranking_dut_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
- name: Stage the DUT claim request
  ansible.builtin.copy:
    dest: '{{ ranking_request_root }}/claim-dut.json'
    content: '{{ ranking_dut_claim_request | to_json }}'
    mode: '0600'
- name: Claim the DUT reservation
  ansible.builtin.command:
    argv: [python3, '{{ ranking_agent_root }}/ranking/remote_agent.py', --request, '{{ ranking_request_root }}/claim-dut.json']
  register: ranking_dut_claim
  when: ranking_action == 'setup'
  failed_when: false
  changed_when: true
- name: Build the DUT resume request
  ansible.builtin.set_fact:
    ranking_dut_resume_request:
      action: resume
      resource: '{{ ranking_dut_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
- name: Stage the DUT resume request
  ansible.builtin.copy:
    dest: '{{ ranking_request_root }}/resume-dut.json'
    content: '{{ ranking_dut_resume_request | to_json }}'
    mode: '0600'
- name: Resume the retained DUT reservation
  ansible.builtin.command:
    argv: [python3, '{{ ranking_agent_root }}/ranking/remote_agent.py', --request, '{{ ranking_request_root }}/resume-dut.json']
  register: ranking_dut_resume
  when: ranking_action == 'status'
  failed_when: false
  changed_when: true
- name: Require the DUT reservation
  ansible.builtin.fail:
    msg: ranking DUT reservation could not be claimed or resumed
  when: ranking_dut_claim.rc | default(1) != 0 and ranking_dut_resume.rc | default(1) != 0
- name: Bind the fresh DUT ownership handle
  ansible.builtin.set_fact:
    ranking_dut_handle:
      resource: '{{ ranking_dut_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
      created: true
  when: ranking_dut_claim.rc | default(1) == 0
- name: Bind the resumed DUT ownership handle
  ansible.builtin.set_fact:
    ranking_dut_handle:
      resource: '{{ ranking_dut_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
      created: false
  when: ranking_dut_claim.rc | default(1) != 0 and ranking_dut_resume.rc | default(1) == 0
- name: Build the PTF claim request
  ansible.builtin.set_fact:
    ranking_ptf_claim_request:
      action: claim
      resource: '{{ ranking_ptf_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
- name: Stage the PTF claim request
  ansible.builtin.copy:
    dest: '{{ ranking_request_root }}/claim-ptf.json'
    content: '{{ ranking_ptf_claim_request | to_json }}'
    mode: '0600'
  delegate_to: '{{ ranking_ptf_host }}'
- name: Claim the PTF reservation
  ansible.builtin.command:
    argv: [python3, '{{ ranking_agent_root }}/ranking/remote_agent.py', --request, '{{ ranking_request_root }}/claim-ptf.json']
  delegate_to: '{{ ranking_ptf_host }}'
  register: ranking_ptf_claim
  when: ranking_action == 'setup'
  failed_when: false
  changed_when: true
- name: Build the PTF resume request
  ansible.builtin.set_fact:
    ranking_ptf_resume_request:
      action: resume
      resource: '{{ ranking_ptf_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
- name: Stage the PTF resume request
  ansible.builtin.copy:
    dest: '{{ ranking_request_root }}/resume-ptf.json'
    content: '{{ ranking_ptf_resume_request | to_json }}'
    mode: '0600'
  delegate_to: '{{ ranking_ptf_host }}'
- name: Resume the retained PTF reservation
  ansible.builtin.command:
    argv: [python3, '{{ ranking_agent_root }}/ranking/remote_agent.py', --request, '{{ ranking_request_root }}/resume-ptf.json']
  delegate_to: '{{ ranking_ptf_host }}'
  register: ranking_ptf_resume
  when: ranking_action == 'status'
  failed_when: false
  changed_when: true
- name: Build the DUT abort request
  ansible.builtin.set_fact:
    ranking_dut_abort_request:
      action: abort
      handle: '{{ ranking_dut_handle }}'
  when: ranking_dut_claim.rc | default(1) == 0 and ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) != 0
- name: Stage the DUT abort request
  ansible.builtin.copy:
    dest: '{{ ranking_request_root }}/abort-dut.json'
    content: '{{ ranking_dut_abort_request | to_json }}'
    mode: '0600'
  when: ranking_dut_claim.rc | default(1) == 0 and ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) != 0
- name: Abort the fresh DUT claim after a PTF reservation failure
  ansible.builtin.command:
    argv: [python3, '{{ ranking_agent_root }}/ranking/remote_agent.py', --request, '{{ ranking_request_root }}/abort-dut.json']
  register: ranking_dut_abort
  failed_when: false
  changed_when: true
  when: ranking_dut_claim.rc | default(1) == 0 and ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) != 0
- name: Build the DUT keep request
  ansible.builtin.set_fact:
    ranking_dut_keep_request:
      action: keep
      handle: '{{ ranking_dut_handle }}'
  when: ranking_dut_claim.rc | default(1) != 0 and ranking_dut_resume.rc | default(1) == 0 and ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) != 0
- name: Stage the DUT keep request
  ansible.builtin.copy:
    dest: '{{ ranking_request_root }}/keep-dut.json'
    content: '{{ ranking_dut_keep_request | to_json }}'
    mode: '0600'
  when: ranking_dut_claim.rc | default(1) != 0 and ranking_dut_resume.rc | default(1) == 0 and ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) != 0
- name: Keep the resumed DUT reservation after a PTF reservation failure
  ansible.builtin.command:
    argv: [python3, '{{ ranking_agent_root }}/ranking/remote_agent.py', --request, '{{ ranking_request_root }}/keep-dut.json']
  register: ranking_dut_keep
  failed_when: false
  changed_when: true
  when: ranking_dut_claim.rc | default(1) != 0 and ranking_dut_resume.rc | default(1) == 0 and ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) != 0
- name: Require the PTF reservation
  ansible.builtin.fail:
    msg: ranking PTF reservation could not be claimed or resumed
  when: ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) != 0
- name: Bind the fresh PTF ownership handle
  ansible.builtin.set_fact:
    ranking_ptf_handle:
      resource: '{{ ranking_ptf_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
      created: true
  when: ranking_ptf_claim.rc | default(1) == 0
- name: Bind the resumed PTF ownership handle
  ansible.builtin.set_fact:
    ranking_ptf_handle:
      resource: '{{ ranking_ptf_resource }}'
      environment_id: '{{ ranking_environment_id }}'
      operation_id: '{{ ranking_operation_id }}'
      created: false
  when: ranking_ptf_claim.rc | default(1) != 0 and ranking_ptf_resume.rc | default(1) == 0
- name: Mark ranking ownership acquired
  ansible.builtin.set_fact:
    ranking_ownership_acquired: true
  when: ranking_dut_handle is defined and ranking_ptf_handle is defined
