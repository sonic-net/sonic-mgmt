csonic_image: "{{ lookup('env', 'SONIC_MGMT_CSONIC_DOCKER_IMAGE') | default('docker-sonic-vs', true) }}"
csonic_image_pull: false

# PortChannel implementation used inside cSONiC neighbors. In auto mode the
# VM host first provisions and probes the native team/loadbalance modules, then
# falls back to the existing userspace-OVS backend if that LAG prerequisite
# cannot be satisfied. Explicit teamd and userspace_ovs modes remain available.
csonic_lag_backend: "{{ lookup('env', 'SONIC_MGMT_CSONIC_LAG_BACKEND') | default('auto', true) }}"
csonic_userspace_ovs_image: "{{ csonic_image }}-userspace-ovs"

# Net base container holds the network namespace that the cSONiC container
# joins (network_mode: container:net_...). It only needs to stay alive and
# carry net_admin; any maintained, small base image works.
# debian:jessie was EOL in 2019 and is no longer pullable, so default to a
# supported slim image. pull=false means pull only when absent locally.
csonic_netbase_image: debian:bookworm-slim
csonic_netbase_image_pull: false
