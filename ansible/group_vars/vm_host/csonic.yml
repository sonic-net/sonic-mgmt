csonic_image: "{{ lookup('env', 'SONIC_MGMT_CSONIC_DOCKER_IMAGE') | default('docker-sonic-vs', true) }}"
csonic_image_pull: false

# PortChannel implementation used inside cSONiC neighbors. Keep the existing
# teamd path as the default; userspace_ovs removes the VM-host kernel's team
# module requirement. The latter derives a local image containing OVS from
# csonic_image during add-topo.
csonic_lag_backend: "{{ lookup('env', 'SONIC_MGMT_CSONIC_LAG_BACKEND') | default('teamd', true) }}"
csonic_userspace_ovs_image: "{{ csonic_image }}-userspace-ovs"
# Some non-cSONiC playbooks materialize every vm_host variable without loading
# vars/docker_registry.yml. Keep those paths independent of this cSONiC setting.
csonic_debian_registry_host: >-
  {{ debian_docker_registry_host | default('publicmirror.azurecr.io:443') }}
csonic_ovs_builder_image: "{{ csonic_debian_registry_host }}/debian:bookworm"

# Net base container holds the network namespace that the cSONiC container
# joins (network_mode: container:net_...). It only needs to stay alive and
# carry net_admin; any maintained, small base image works.
# Use the existing SONiC Debian mirror to avoid Docker Hub pull limits.
# pull=false means pull only when absent locally.
csonic_netbase_image: "{{ csonic_debian_registry_host }}/debian:bookworm"
csonic_netbase_image_pull: false
