- name: Render exact installed templates from frozen candidate-port contexts
  hosts: "{{ generic_render_hosts }}"
  connection: ssh
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Select original device authentication
      include_tasks: generic_hwsku_device_auth.yml
    - name: Allocate this call's private render directory
      tempfile:
        state: directory
        prefix: sonic-generic-render-
      register: generic_remote
    - name: Render and fetch private add/deploy buffer and QoS tables
      block:
        - name: Run installed SONiC templates on candidate contexts
          generic_hwsku_render:
            request: "{{ generic_render_requests[inventory_hostname][item] }}"
            destination: "{{ generic_remote.path }}/{{ item }}.json"
          loop: "{{ generic_render_requests[inventory_hostname].keys() | list | sort }}"
          become: true
          no_log: true
        - name: Fetch private template results
          fetch:
            src: "{{ generic_remote.path }}/{{ item }}.json"
            dest: "{{ generic_render_directory }}/{{ inventory_hostname }}-{{ item }}.json"
            flat: true
          loop: "{{ generic_render_requests[inventory_hostname].keys() | list | sort }}"
          become: true
          no_log: true
        - name: Restrict private template results
          file:
            path: "{{ generic_render_directory }}/{{ inventory_hostname }}-{{ item }}.json"
            mode: "0600"
          loop: "{{ generic_render_requests[inventory_hostname].keys() | list | sort }}"
          delegate_to: localhost
          no_log: true
      rescue:
        - name: Report the retained private render evidence without exposing its contents
          fail:
            msg: >-
              Generic template rendering or transfer failed; private evidence retained on
              {{ inventory_hostname }}:{{ generic_remote.path }}
    - name: Remove only this call's private render artifacts after successful transfer
      file:
        path: "{{ generic_remote.path }}"
        state: absent
      become: true
